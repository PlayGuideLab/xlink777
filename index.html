<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X 外链技巧 Wiki | xlink777</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #fff; color: #111; line-height: 1.6; }
    header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 700; font-size: 1.25rem; }
    nav a { margin-left: 20px; color: #374151; text-decoration: none; }
    .hero { background: #f9fafb; padding: 60px 24px; text-align: center; }
    .hero h1 { font-size: 2.5rem; margin: 0 0 12px; }
    .container { max-width: 1100px; margin: 40px auto; padding: 0 24px; }
    .section { margin-bottom: 48px; }
    .section h2 { font-size: 1.5rem; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; background: #fff; }
    .card h3 { margin: 0 0 8px; }
    .badge { display: inline-block; background: #dbeafe; color: #1d4ed8; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">XLink777 Wiki</div>
    <nav>
      <a href="#positions">位置</a>
      <a href="#tips">技巧</a>
      <a href="#methods">方法论</a>
    </nav>
  </header>
  <div class="hero">
    <h1>X 外链发布技巧与方法</h1>
    <p>分类汇总 | 基于创作者实践</p>
  </div>
  <div class="container">
    <div class="section" id="positions">
      <h2>能发外链的位置</h2>
      <div class="cards">
        <div class="card"><span class="badge">最推荐</span><h3>第一回复</h3><p>主帖发完整价值内容，自己回复第一条放链接。</p></div>
        <div class="card"><span class="badge">安全</span><h3>Bio / 置顶帖</h3><p>长期链接放这里，主帖引导。</p></div>
        <div class="card"><span class="badge">官方</span><h3>主帖直接放</h3><p>2026年官方已无惩罚，建议实测。</p></div>
      </div>
    </div>
    <div class="section" id="tips">
      <h2>实用技巧</h2>
      <div class="cards">
        <div class="card"><h3>主帖独立有价值</h3><p>不要让用户必须点链接才能获得信息。</p></div>
        <div class="card"><h3>加图片/视频</h3><p>配合视觉内容效果更好。</p></div>
        <div class="card"><h3>Premium 优势</h3><p>付费账号发链接表现更好。</p></div>
      </div>
    </div>
    <div class="section" id="methods">
      <h2>方法论</h2>
      <div class="cards">
        <div class="card"><h3>保留平台停留时间</h3><p>主帖不放链接可减少退出意图信号。</p></div>
        <div class="card"><h3>强钩子 + 引导</h3><p>主帖强钩子，回复中提供链接。</p></div>
      </div>
    </div>
  </div>
</body>
</html>
